<!DOCTYPE html>

  <meta name="description" content="Promoción especial de Con Magui a Disney." />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BZQVQR29GB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BZQVQR29GB');

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="icon" href="assets/icons/favicon.ico" sizes="any">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandPrimary: "#C56F95",
            brandSecondary: "#E1A9C2",
            brandAccent: "#C9A24A",
            brandDark: "#8E6D2A",

  <script src="assets/js/public-config.js"></script>
  <style>
    :root {
      --promo-lead-top: 7rem;
    }
    .promo-title-hero {
      font-size: clamp(2.25rem, 5vw, 4.25rem);
      line-height: 1.03;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .promo-title-standard {
      font-size: clamp(1.8rem, 4vw, 3rem);
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .promo-title-compact {
      font-size: clamp(1.45rem, 3vw, 2.2rem);
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .promo-title-hero strong,
    .promo-title-standard strong,
    .promo-title-compact strong,
    .promo-title-hero b,
    .promo-title-standard b,
    .promo-title-compact b {
      font-weight: 900;
    }
    .promo-title-left { text-align: left; }
    .promo-title-center { text-align: center; }
    .promo-title-right { text-align: right; }
    .promo-rich-body {
      font-size: 1.08rem;
      line-height: 1.64;
      letter-spacing: -0.01em;
      font-weight: 500;
      --promo-subtitle-color: inherit;
      --promo-subtitle-align: left;
    }
    .promo-body-paragraph {
      margin: 0 0 0.8rem;
    }
    .promo-body-heading {
      margin: 1.1rem 0 0.55rem;
      font-size: 1.35rem;
      line-height: 1.2;
      font-weight: 800;
      color: var(--promo-subtitle-color, inherit);
      text-align: var(--promo-subtitle-align, left);
    }
    .promo-body-list {
      margin: 0 0 0.95rem;
      padding-left: 1.35rem;
      list-style: disc;
    }
    .promo-body-list li {
      margin: 0.35rem 0;
    }
    .promo-body-list li::marker {
      color: #c96b95;
    }
    .promo-lead-panel {
      position: sticky;
      top: var(--promo-lead-top, 7rem);
      align-self: flex-start;
      max-height: calc(100vh - var(--promo-lead-top, 7rem) - 1rem);
      overflow-y: auto;
    }
  </style>
</head>
<body data-page="promo-dinamica" class="bg-brandLight text-brandText">
  <div id="site-nav"></div>

  <main id="promoRoot" class="pt-32 pb-14 px-4">
    <section class="max-w-5xl mx-auto bg-white rounded-[2rem] shadow-xl border border-brandSecondary/30 p-8 text-center">
      <div class="animate-pulse text-brandPrimary font-bold">Cargando promoción...</div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/whatsapp.js?v=20260306-1"></script>
  <script>
    (function () {
      const root = document.getElementById('promoRoot');
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug') || '';
      const endpointBase = window.PUBLIC_PROMOTIONS_API_URL || '';

    function decodeHtmlEntities(value) {
      const textarea = document.createElement('textarea');
      textarea.innerHTML = String(value || '');
      return textarea.value;
    }

    function stripHtml(value) {
      return decodeHtmlEntities(String(value || '').replace(/<[^>]*>/g, ' '))
        .replace(/\s+/g, ' ')
        .trim();
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function sanitizeInlineHtml(text) {
      const template = document.createElement('template');
      template.innerHTML = decodeHtmlEntities(text);
      const inlineTags = new Set(['STRONG', 'B', 'EM', 'I', 'U']);
      const walk = (node) => {
        if (!node) return '';
        if (node.nodeType === Node.TEXT_NODE) {
          return escapeHtml(node.textContent || '');
        }
        if (node.nodeType !== Node.ELEMENT_NODE) {
          return '';
        }
        const tag = node.tagName.toUpperCase();
        if (tag === 'BR') return '<br>';
        if (inlineTags.has(tag)) {
          const normalizedTag = tag === 'B' ? 'strong' : tag === 'I' ? 'em' : tag.toLowerCase();
          return `<${normalizedTag}>${Array.from(node.childNodes).map(walk).join('')}</${normalizedTag}>`;
        }
        if (tag === 'LI') {
          return `<li>${Array.from(node.childNodes).map(walk).join('')}</li>`;
        }
        if (tag === 'UL' || tag === 'OL') {
          return `<${tag.toLowerCase()}>${Array.from(node.children).map(walk).join('')}</${tag.toLowerCase()}>`;
        }
        if (tag === 'P' || tag === 'DIV' || tag === 'SPAN') {
          return Array.from(node.childNodes).map(walk).join(tag === 'DIV' || tag === 'P' ? '<br>' : '');
        }
        return Array.from(node.childNodes).map(walk).join('');
      };
      return Array.from(template.content.childNodes).map(walk).join('');
    }

    function renderRichNode(node) {
      if (!node) return '';
      if (node.nodeType === Node.TEXT_NODE) {
        return escapeHtml(node.textContent || '');
      }
      if (node.nodeType !== Node.ELEMENT_NODE) {
        return '';
      }
      const tag = node.tagName.toUpperCase();
      if (tag === 'BR') return '<br>';
      if (tag === 'STRONG' || tag === 'B' || tag === 'EM' || tag === 'I' || tag === 'U') {
        const normalizedTag = tag === 'B' ? 'strong' : tag === 'I' ? 'em' : tag.toLowerCase();
        return `<${normalizedTag}>${Array.from(node.childNodes).map(renderRichNode).join('')}</${normalizedTag}>`;
      }
      if (tag === 'LI') {
        return `<li>${Array.from(node.childNodes).map(renderRichNode).join('')}</li>`;
      }
      if (tag === 'UL' || tag === 'OL') {
        return `<${tag.toLowerCase()} class="promo-body-list">${Array.from(node.children).map(renderRichNode).join('')}</${tag.toLowerCase()}>`;
      }
      if (tag === 'H1' || tag === 'H2' || tag === 'H3' || tag === 'H4' || tag === 'H5' || tag === 'H6') {
        return `<h3 class="promo-body-heading">${Array.from(node.childNodes).map(renderRichNode).join('')}</h3>`;
      }
      if (tag === 'P' || tag === 'DIV') {
        const content = Array.from(node.childNodes).map(renderRichNode).join('');
        const plain = node.textContent.replace(/\s+/g, ' ').trim();
        if (isHeadingLine(plain, '')) {
          return `<h3 class="promo-body-heading">${content.replace(/<br>/g, ' ')}</h3>`;
        }
        return `<p class="promo-body-paragraph">${content}</p>`;
      }
      if (tag === 'SPAN') {
        return Array.from(node.childNodes).map(renderRichNode).join('');
      }
      return Array.from(node.childNodes).map(renderRichNode).join('');
    }

      function isBulletLine(line) {
        return /^([•\-\*·]\s*|\d+[\.\)]\s*)/.test(line);
      }

      function isHeadingLine(line, nextLine) {
        const cleaned = String(line || '').trim();
        if (!cleaned) return false;
        if (/^[•\-\*·]/.test(cleaned) || /^\d+[\.\)]\s+/.test(cleaned)) return false;
        const normalized = cleaned.replace(/<\/?[^>]+>/g, '').trim();
        const headingText = normalized.replace(/^[¿¡"'\-–—\s]+/, '');
        if (!headingText) return false;
        if (headingText.length > 72) return false;
        if (/[.!?]$/.test(headingText) && !/[?:]$/.test(headingText)) return false;
        const words = headingText.split(/\s+/).filter(Boolean).length;
        if (words > 10) return false;
        if (!/^[A-ZÁÉÍÓÚÑ¿¡]/.test(headingText)) return false;
        if (!nextLine) return true;
        if (isBulletLine(nextLine)) return true;
        if (/^[A-ZÁÉÍÓÚÑ¿¡].{0,60}[?:]$/.test(headingText)) return true;
        return words <= 6;
      }

      function formatInline(text) {
        return sanitizeInlineHtml(decodeHtmlEntities(text));
      }

      function renderRichText(rawText) {
        const text = decodeHtmlEntities(rawText).replace(/\r\n/g, '\n').trim();
        if (!text) return '';
        if (/[<][a-z!/]/i.test(text)) {
          const template = document.createElement('template');
          template.innerHTML = text;
          return Array.from(template.content.childNodes).map(renderRichNode).join('');
        }
        const lines = text.split('\n');
        const blocks = [];
        let paragraph = [];
        let listItems = [];
        let currentListItem = '';

        const flushParagraph = () => {
          if (!paragraph.length) return;
          blocks.push(`<p class="promo-body-paragraph">${formatInline(paragraph.join(' '))}</p>`);
          paragraph = [];
        };

        const flushCurrentListItem = () => {
          if (!currentListItem) return;
          listItems.push(currentListItem.trim());
          currentListItem = '';
        };

        const flushList = () => {
          flushCurrentListItem();
          if (!listItems.length) return;
          blocks.push(`<ul class="promo-body-list">${listItems.map((item) => `<li>${formatInline(item)}</li>`).join('')}</ul>`);
          listItems = [];
        };

        for (let i = 0; i < lines.length; i += 1) {
          const rawLine = lines[i];
          const line = rawLine.trim();
          const nextLine = (lines[i + 1] || '').trim();
          if (!line) {
            flushCurrentListItem();
            flushParagraph();
            flushList();
            continue;
          }
          if (/^\d+$/.test(line)) {
            continue;
          }
          const bulletMatch = line.match(/^([•\-\*·]\s+|\d+[\.\)]\s+)(.+)$/);
          if (bulletMatch) {
            flushCurrentListItem();
            flushParagraph();
            currentListItem = bulletMatch[2].trim();
            continue;
          }
          if (isHeadingLine(line, nextLine)) {
            flushCurrentListItem();
            flushParagraph();
            flushList();
            blocks.push(`<h3 class="promo-body-heading">${formatInline(line.replace(/[:.]+$/, ''))}</h3>`);
            continue;
          }
          if (currentListItem) {
            currentListItem = `${currentListItem} ${line}`.trim();
            continue;
          }
          flushList();
          paragraph.push(line);
        }
        flushCurrentListItem();
        flushParagraph();
        flushList();
        return blocks.join('');
      }

      function fieldHtml(field) {
        const required = field.required ? 'required' : '';
        const common = `name="${escapeHtml(field.key)}" id="lead_${escapeHtml(field.key)}" ${required} placeholder="${escapeHtml(field.placeholder || '')}" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brandPrimary text-gray-700 bg-white"`;
        if (field.type === 'textarea') {
          return `<textarea rows="4" ${common}></textarea>`;
        }
        return `<input type="${escapeHtml(field.type || 'text')}" ${common}>`;
      }

      function mediaHtml(item) {
        const detail = item.detail || {};
        const mediaUrl = detail.primary_media_url || (item.card && item.card.media_url) || '';
        const title = detail.title || (item.card && item.card.title) || 'Promoción';
        if (!mediaUrl) return '';
        const isVideo = mediaUrl.toLowerCase().match(/\.(mp4|webm|mov)(\?|$)/);
        if (isVideo) {
          return `<video src="${escapeHtml(mediaUrl)}" class="w-full rounded-2xl shadow-lg mb-8 bg-white" autoplay muted loop playsinline controls></video>`;
        }
        return `<img src="${escapeHtml(mediaUrl)}" alt="${escapeHtml(title)}" class="w-full rounded-2xl shadow-lg mb-8 object-cover bg-white" loading="eager" onerror="this.closest('article')?.querySelector('.promo-secondary-media-fallback')?.remove(); this.remove();">`;
      }

      function renderLeadForm(item) {
        const form = item.lead_form || {};
        if (form.enabled === false) return '';
        const fields = Array.isArray(form.fields) ? form.fields : [];
        const title = form.title || 'Solicitá esta promo';
        const summary = form.summary || 'Completá tus datos y te contactamos con una propuesta personalizada.';
        const submitLabel = form.submit_label || 'Solicitar cotización';
        return `
          <aside class="promo-lead-panel bg-white rounded-3xl shadow-2xl overflow-hidden">
            <div class="bg-gradient-to-r from-brandPrimary to-brandAccent px-6 py-5">
              <h2 class="text-xl font-bold text-white">${escapeHtml(title)}</h2>
              <p class="text-white/85 text-sm mt-1">${escapeHtml(summary)}</p>
            </div>
            <form id="promoLeadForm" class="p-6 space-y-4">
              ${fields.map(field => `
                <label class="block">
                  <span class="block text-sm font-semibold text-gray-700 mb-1">${escapeHtml(field.label)}${field.required ? ' *' : ''}</span>
                  ${fieldHtml(field)}
                </label>
              `).join('')}
              <div id="leadError" class="hidden text-sm text-red-600 bg-red-50 rounded-xl px-4 py-3"></div>
              <button type="submit" class="w-full bg-gradient-to-r from-brandPrimary to-brandAccent text-white py-3.5 rounded-xl font-bold hover:shadow-lg transition">
                ${escapeHtml(submitLabel)}
              </button>
            </form>
          </aside>
        `;
      }

      function renderPage(item) {
        const card = item.card || {};
        const detail = item.detail || {};
        const title = detail.title_html || detail.title || card.title || 'Promoción';
        const body = detail.body_html || detail.body || card.summary || '';
        const titleStyle = ['hero', 'standard', 'compact'].includes(detail.title_style) ? detail.title_style : 'hero';
        const titleAlignment = ['left', 'center', 'right'].includes(detail.title_alignment) ? detail.title_alignment : 'left';
        const titleColor = detail.title_color || '#C56F95';
        const subtitleColor = detail.subtitle_color || detail.body_color || '#4A3240';
        const subtitleAlignment = ['left', 'center', 'right'].includes(detail.subtitle_alignment) ? detail.subtitle_alignment : (detail.body_alignment || 'left');
        document.title = (detail.seo_title || stripHtml(title) || 'Promoción') + ' | Con Magui a Disney';
        const meta = document.querySelector('meta[name="description"]');
        if (meta) meta.setAttribute('content', detail.meta_description || stripHtml(body).slice(0, 150) || 'Promoción especial de Con Magui a Disney.');
        root.innerHTML = `
          <section class="pb-10" data-promo-hero-title>
            <div class="max-w-7xl mx-auto" style="text-align:${escapeHtml(titleAlignment)};">
              <p class="text-xs uppercase tracking-[0.22em] text-brandPrimary font-bold mb-3">Promoción especial</p>
              <h1 class="promo-title-${escapeHtml(titleStyle)} promo-title-${escapeHtml(titleAlignment)} text-brandText mb-4" style="color:${escapeHtml(titleColor)};">${formatInline(title)}</h1>
              ${card.validity_text ? `<p class="text-lg" style="color:${escapeHtml(detail.body_color || '#4A3240')};">${escapeHtml(card.validity_text)}</p>` : ''}
            </div>
          </section>
          <section class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-10 items-start">
            <article class="lg:col-span-8">
              ${mediaHtml(item)}
              <div class="bg-white rounded-3xl shadow-md border border-brandSecondary/30 p-7 md:p-9">
                <div class="promo-rich-body" style="text-align:${escapeHtml(detail.body_alignment || 'left')};color:${escapeHtml(detail.body_color || '#4A3240')};--promo-subtitle-color:${escapeHtml(subtitleColor)};--promo-subtitle-align:${escapeHtml(subtitleAlignment)};">${renderRichText(body)}</div>
                ${detail.secondary_media_url ? `<div class="promo-secondary-media-fallback"><img src="${escapeHtml(detail.secondary_media_url)}" alt="${escapeHtml(title)}" class="w-full rounded-2xl shadow mt-8 object-cover bg-white" loading="lazy" onerror="this.closest('.promo-secondary-media-fallback')?.remove();"></div>` : ''}
              </div>
            </article>
            <div class="lg:col-span-4">${renderLeadForm(item)}</div>
          </section>
        `;
        bindLeadForm(item);
      }

      function bindLeadForm(item) {
        const form = document.getElementById('promoLeadForm');
        if (!form) return;
        const error = document.getElementById('leadError');
        const leadForm = item.lead_form || {};
        form.addEventListener('submit', function (event) {
          event.preventDefault();
          const data = new FormData(form);
          const values = {};
          for (const [key, value] of data.entries()) values[key] = String(value || '').trim();
          if (!values.name || !values.whatsapp) {
            if (error) {
              error.textContent = 'Por favor completá nombre y WhatsApp para que podamos contactarte.';
              error.classList.remove('hidden');
            }
            return;
          }
          if (error) error.classList.add('hidden');
          const lines = [
            (leadForm.message && leadForm.message.intro) || `Hola Magui! Me interesa la promo *${item.card && item.card.title ? item.card.title : item.slug}*.`,
            '',
            `Promo: ${item.card && item.card.title ? item.card.title : item.slug}`,
            `Origen: ${item.slug}`,
            values.travel_month ? `Fecha/mes tentativo: ${values.travel_month}` : null,
            values.travelers ? `Viajeros: ${values.travelers}` : null,
            values.preferred_hotel ? `Hotel de preferencia: ${values.preferred_hotel}` : null,
            values.arrival_date ? `Fecha de llegada: ${values.arrival_date}` : null,
            values.nights ? `Noches: ${values.nights}` : null,
            values.ticket_start_date ? `Inicio tickets: ${values.ticket_start_date}` : null,
            values.adults ? `Adultos/mayores: ${values.adults}` : null,
            values.children ? `Menores: ${values.children}` : null,
            '',
            `Nombre: ${values.name}`,
            `WhatsApp: ${values.whatsapp}`,
            values.email ? `Email: ${values.email}` : null,
            values.message ? `Consulta: ${values.message}` : null
          ].filter(Boolean);
          if (typeof gtag === 'function') {
            const ga4 = leadForm.ga4 || {};
            gtag(ga4.event_name || 'generate_lead', {
              event_category: ga4.event_category || 'promo',
              event_label: ga4.event_label || `${item.slug}_lead_form`,
              transport_type: 'beacon'
            });
          }
          const phone = leadForm.whatsapp_phone || '5493834319891';
          window.open(`https://wa.me/${phone}?text=${encodeURIComponent(lines.join('\\n'))}`, '_blank', 'noopener,noreferrer');
        });
      }

      async function loadPromo() {
        if (!slug || !endpointBase) {
          root.innerHTML = '<section class="max-w-4xl mx-auto bg-white rounded-3xl shadow p-8 text-center"><h1 class="text-2xl font-bold text-brandPrimary mb-3">Promo no encontrada</h1><p class="text-gray-600">Volvé a promociones y elegí una oferta activa.</p></section>';
          return;
        }
        try {
          const response = await fetch(endpointBase.replace(/\/$/, '') + '/' + encodeURIComponent(slug), { cache: 'no-store' });
          if (!response.ok) throw new Error('promo_not_found');
          const payload = await response.json();
          if (!payload.ok || !payload.item) throw new Error('invalid_payload');
          renderPage(payload.item);
        } catch (error) {
          root.innerHTML = '<section class="max-w-4xl mx-auto bg-white rounded-3xl shadow p-8 text-center"><h1 class="text-2xl font-bold text-brandPrimary mb-3">No pudimos cargar esta promo</h1><p class="text-gray-600">Probá nuevamente o escribinos por WhatsApp para pedir más información.</p></section>';
        }
      }

      loadPromo();
    })();
  </script>
</body>
</html>
